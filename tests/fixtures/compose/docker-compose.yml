services:
  db:
    image: postgres:16
    ports:
      - "5432:5432"
  mail:
    image: mailhog/mailhog
    ports:
      - "8025:8025"
  web:
    image: example/web
    ports:
      - target: 3000
        published: 4310
        protocol: tcp
  admin:
    image: example/admin
    ports:
      - target: 3001
        published: "4311"
        protocol: tcp
